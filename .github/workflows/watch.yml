name: Watch WoW patch notes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_post:
        description: Send the latest post to Discord now
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for new notes
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python3 watcher.py ${{ inputs.test_post && '--test-post' || '' }}
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "wow-patch-bot"
          git config user.email "wow-patch-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update seen posts" && git push)
