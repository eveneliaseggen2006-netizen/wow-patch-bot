name: Watch WoW patch notes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_post:
        description: Send the latest post to Discord now
        type: boolean
        default: false
      fake_update:
        description: Send a labelled fake post and an update to it
        type: boolean
        default: false
      bot_name:
        description: Rename the bot to this, instead of checking for notes
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for new notes
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          BOT_NAME: ${{ inputs.bot_name }}
        run: |
          if [ -n "$BOT_NAME" ]; then
            python3 watcher.py --set-name "$BOT_NAME"
          else
            python3 watcher.py ${{ inputs.test_post && '--test-post' || '' }} ${{ inputs.fake_update && '--test-update' || '' }}
          fi
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "wow-patch-bot"
          git config user.email "wow-patch-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update seen posts" && git push)
